    <g transform="translate(1120 759)"><circle r="13" fill="#a5bed2"/><circle cx="48" r="13" fill="#a5bed2"/><circle cx="96" r="13" fill="#a5bed2"/><text x="-10" y="50" fill="#91a8c6" font-size="20">LED / buzzer</text></g>
    <text x="255" y="880" fill="#91a8c6" font-size="20">16 × 2 LCD output</text>
    <path d="M72 922h1356" stroke="#2b3d55"/>
    <text x="72" y="963" fill="#7890b2" font-size="18">CONCEPT ILLUSTRATION · generic hardware layout · no measurement or Pi model implied</text>
