<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" fill="none">
  <title>SkiliAir — illustrated sensor and hardware system</title>
  <desc>Concept illustration of dust sensing through an ADC, a generic Raspberry Pi, LCD output, and fan control. Not a photograph or an exact wiring diagram.</desc>
  <defs>
    <linearGradient id="bg" x2="1500" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#14243a"/><stop offset="1" stop-color="#070e1b"/></linearGradient>
    <linearGradient id="pcb" x2="450" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#23644e"/><stop offset="1" stop-color="#123b32"/></linearGradient>
    <linearGradient id="metal" x2="0" y2="100%"><stop stop-color="#dce4ee"/><stop offset="1" stop-color="#8494a9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="m0 0 7 4-7 4" stroke="#60a5fa" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1500" height="1000" rx="24" fill="url(#bg)"/>
