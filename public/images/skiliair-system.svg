    <g fill="#8ca0b9"><circle cx="95" cy="367" r="5"/><circle cx="125" cy="405" r="9"/><circle cx="163" cy="350" r="4"/><circle cx="190" cy="428" r="6"/><circle cx="111" cy="466" r="4"/><circle cx="227" cy="382" r="8"/><circle cx="63" cy="425" r="4"/><circle cx="212" cy="488" r="4"/></g>
    <path d="M95 520c50-30 76-33 129-32" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
