<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" fill="none">
  <title>satzivo — German practice and cloud study architecture</title>
  <desc>Architecture illustration, not an application screenshot. Example German text and learning domains above a React interface, Express API, and Supabase Auth/PostgreSQL row-level security path. No learner progress or exam results are shown.</desc>
  <defs>
    <linearGradient id="background" x2="1500" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#162b3d"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="100%"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7e4da"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".2"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#7b9ab4" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1500" height="1000" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="114" fill="#f1f5f9" font-size="52" font-weight="600" letter-spacing="-2">satzivo<tspan fill="#47ad9b">.</tspan></text>
    <text x="1410" y="106" text-anchor="end" fill="#9bb2c5" font-size="19" letter-spacing="2">GERMAN / A2</text>
    <g filter="url(#shadow)">
      <path d="M110 233q274-32 620 0v350q-340-30-620 0z" fill="url(#paper)"/>
      <path d="M730 233q330-32 640 0v350q-330-30-640 0z" fill="#e9e7df"/>
      <path d="M730 233v350" stroke="#c9cfc6" stroke-width="2"/>
      <path d="M135 594q275-30 595 0 320-30 615 0" stroke="#9ba9a5" stroke-opacity=".35" stroke-width="3"/>
    </g>
    <text x="160" y="290" fill="#5d776c" font-size="17" letter-spacing="3">DEUTSCH LERNEN</text>
    <text x="160" y="367" fill="#213c35" font-size="47" letter-spacing="-1">Ich lerne Deutsch.</text>
    <path d="M162 394h483" stroke="#337e6b" stroke-width="2" stroke-opacity=".4"/>
    <text x="160" y="448" fill="#337e6b" font-size="17" font-weight="600">ES</text>
    <text x="206" y="448" fill="#4d5f58" font-size="24">Aprendo alemán.</text>
    <text x="160" y="497" fill="#337e6b" font-size="17" font-weight="600">EN</text>
    <text x="206" y="497" fill="#4d5f58" font-size="24">I am learning German.</text>
    <text x="789" y="290" fill="#5d776c" font-size="17" letter-spacing="3">PRACTICE &amp; REVIEW</text>
    <g fill="#2d483f" font-size="28">
      <text x="789" y="354">Lesen</text><text x="1080" y="354">Hören</text>
      <text x="789" y="412">Schreiben</text><text x="1080" y="412">Sprechen</text>
    </g>
    <path d="M789 446h510" stroke="#a9b6ac" stroke-opacity=".7"/>
    <text x="789" y="494" fill="#4d5f58" font-size="24">Wortschatz · Flashcards</text>
    <text x="90" y="675" fill="#8fa8bf" font-size="16" letter-spacing="2">FROM PRACTICE TO PERSISTENT PROGRESS</text>
    <g fill="#102235" stroke="#34516b" stroke-width="1.5">
      <rect x="90" y="714" width="365" height="157" rx="8"/>
      <rect x="565" y="714" width="365" height="157" rx="8"/>
      <rect x="1040" y="714" width="370" height="157" rx="8"/>
    </g>
    <path d="M470 791h75M945 791h75" stroke="#7b9ab4" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#edf3f8" font-size="30" font-weight="500">
      <text x="120" y="765">React + TypeScript</text>
      <text x="595" y="765">Node.js / Express</text>
      <text x="1070" y="765">Supabase</text>
    </g>
    <g fill="#9db4c8" font-size="20">
      <text x="120" y="810">Practice · ES / EN</text><text x="120" y="841">Exams · review</text>
      <text x="595" y="810">Verified access tokens</text><text x="595" y="841">Study API · feedback</text>
      <text x="1070" y="810">Auth · PostgreSQL RLS</text><text x="1070" y="841">User-scoped progress</text>
    </g>
    <text x="90" y="943" fill="#68839c" font-size="14" letter-spacing="1.5">ARCHITECTURE ILLUSTRATION / EXAMPLE TEXT / NOT A PRODUCT SCREENSHOT</text>
  </g>
</svg>
