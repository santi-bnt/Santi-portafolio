<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" fill="none">
  <title>MATT writer and camera observer — illustrative reconstruction</title>
  <desc>Black writing enclosure with a conceptual fitted lid, two LCD windows and keypad. Blue side levers carry a snug marker collar and eraser cross. The white observer faces the board with a stylized animated field of view. This scan effect is conceptual, not evidence of implemented vision integration. Based on the owner's photographs and clarifications, not a prototype photograph.</desc>
  <style>
    .scan-sweep { transform: translateY(345px); animation: scan-board 4s ease-in-out infinite alternate; }
    @keyframes scan-board { from { transform: translateY(301px); } to { transform: translateY(384px); } }
    @media (prefers-reduced-motion: reduce) { .scan-sweep { animation: none; transform: translateY(345px); } }
  </style>
  <defs>
    <linearGradient id="room" x2="1500" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#14263d"/><stop offset="1" stop-color="#050a14"/></linearGradient>
    <linearGradient id="board" x2="1000" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f3f2"/><stop offset="1" stop-color="#cdd6de"/></linearGradient>
    <linearGradient id="case" x2="650" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#272c34"/><stop offset="1" stop-color="#101318"/></linearGradient>
    <linearGradient id="white" x2="0" y2="100%"><stop stop-color="#fafaf5"/><stop offset="1" stop-color="#ccd3d7"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="100%"><stop stop-color="#316dda"/><stop offset="1" stop-color="#173f9c"/></linearGradient>
    <linearGradient id="marker-body" x1="750" y1="0" x2="777" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#afbecd"/><stop offset=".28" stop-color="#f8fafc"/><stop offset=".65" stop-color="#e9eff5"/><stop offset="1" stop-color="#91a4b9"/></linearGradient>
    <linearGradient id="scan-cone" x1="850" y1="450" x2="1215" y2="475" gradientUnits="userSpaceOnUse"><stop stop-color="#168cff" stop-opacity=".09"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".015"/></linearGradient>
    <linearGradient id="scan-trail" x2="0" y2="100%"><stop stop-color="#168cff" stop-opacity="0"/><stop offset="1" stop-color="#168cff" stop-opacity=".14"/></linearGradient>
    <clipPath id="scan-area"><rect x="644" y="295" width="104" height="95" rx="5"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="10" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="4" dy="9" stdDeviation="5" flood-color="#000" flood-opacity=".23"/></filter>
    <g id="screw"><circle r="5" fill="#6c7887"/><path d="m-2-2 4 4" stroke="#1d2732" stroke-width="1.5"/></g>
    <g id="key"><rect width="28" height="26" rx="3" fill="#bbc3cd"/><path d="M3 23h22" stroke="#77818e" stroke-width="2"/></g>
    <marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#2878bf" stroke-width="1.5" fill="none"/></marker>
  </defs>
  <rect width="1500" height="1000" fill="url(#room)"/>
  <!-- Whiteboard lettering and arrows below are illustrative, not captured output. -->
  <g filter="url(#shadow)">
    <rect x="65" y="100" width="1065" height="690" rx="12" fill="#607387"/>
    <rect x="75" y="110" width="1045" height="670" rx="5" fill="url(#board)"/>
    <path d="M78 113h1038M78 777h1038" stroke="#f5f7f9" stroke-width="3"/>
    <path d="M108 791h971l-20 22H108z" fill="#8c9dab"/>
  </g>
  <!-- Previously written sample marks, drawn as paths rather than measured output. -->
  <g stroke="#263f58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- HELLO, complete; separately marked as existing writing below. -->
    <path d="m188 184 1 48m26-48-1 48m-25-25 26-1M254 184h-22v48h24m-24-25h19M275 184v48h24M317 184v48h24M375 184c-27-5-28 53-1 49 25-1 26-52 1-49z"/>
    <path d="M187 250q90 3 201-2" stroke-width="2" opacity=".5"/>
    <!-- Earlier alphabet strokes. -->
    <path d="m192 365 15-44 16 44m-25-15h19M246 365v-44c31-6 34 20 0 21 37-3 35 27 0 23M309 325c-34-20-37 55-2 37"/>
    <!-- A small diagram left from an earlier writing pass. -->
    <path d="M194 534h70v52h-70zM265 559h60m-10-7 10 7-10 7" stroke-width="2.5"/>
    <path d="M358 535c-35-1-37 53-2 53 36 0 37-53 2-53z" stroke-width="2.5"/>
  </g>
  <!-- Conceptual recognition overlays for earlier marks; no confidence scores. -->
  <g aria-label="Conceptual recognition of existing board marks">
    <g stroke="#168cff" stroke-width="1.5" stroke-opacity=".18" stroke-dasharray="3 9">
      <path d="M1171 469 402 216M1171 469 324 345M1171 469 400 560"/>
    </g>
    <g stroke="#168cff" stroke-width="1.5" stroke-opacity=".55">
      <path d="M174 186v-14h14m200 0h14v14m0 62v14h-14m-200 0h-14v-14"/>
      <path d="M178 324v-14h14m118 0h14v14m0 42v14h-14m-118 0h-14v-14"/>
      <path d="M180 536v-14h14m192 0h14v14m0 50v14h-14m-192 0h-14v-14"/>
    </g>
    <g fill="#168cff" fill-opacity=".7" stroke="#edf5fc" stroke-width="1">
      <circle cx="188" cy="184" r="3"/><circle cx="375" cy="184" r="3"/>
      <circle cx="207" cy="321" r="3"/><circle cx="309" cy="325" r="3"/>
      <circle cx="194" cy="534" r="3"/><circle cx="358" cy="535" r="3"/>
    </g>
    <text x="174" y="157" fill="#2878bf" font-family="Consolas, monospace" font-size="11" letter-spacing="1">EXISTING MARKS</text>
  </g>
  <!-- Conceptual camera field of view, not a visualization of live sensor data. -->
  <g aria-label="Conceptual camera scan effect">
    <path d="M1200 480 748 295H644V390H748z" fill="url(#scan-cone)"/>
    <path d="M1171 469 748 295M1235 489 748 390" stroke="#168cff" stroke-opacity=".19" stroke-width="1.5"/>
    <path d="M644 310v-15h15m74 0h15v15m0 65v15h-15m-74 0h-15v-15" stroke="#168cff" stroke-opacity=".5" stroke-width="2"/>
    <g clip-path="url(#scan-area)">
      <g class="scan-sweep">
        <rect x="645" y="-22" width="102" height="22" fill="url(#scan-trail)"/>
        <path d="M645 0h102" stroke="#168cff" stroke-opacity=".65" stroke-width="2"/>
      </g>
    </g>
    <!-- Unfinished M: the final downstroke ends exactly at the marker nib. -->
    <path d="M660 367V310L682 342 704.68 310V344.48" stroke="#263f58" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="644" y="278" fill="#2878bf" font-family="Consolas, monospace" font-size="12" letter-spacing="1">WRITE REGION</text>
  </g>
  <!-- Writer: broad black box; blue tools are pivoted from its side walls. -->
  <g id="writer" transform="translate(337 260) scale(.48)">
  <g filter="url(#shadow)">
    <path d="M329 361 737 361 765 389 765 676 350 676 329 651z" fill="#080d14"/>
    <path d="M329 361 737 361 737 651 329 651z" fill="url(#case)" stroke="#3b424d" stroke-width="3"/>
    <path d="m737 361 28 28v287l-28-25z" fill="#0a0f17"/>
    <path d="m329 651 21 25h415l-28-25z" fill="#131b25"/>
    <rect x="343" y="375" width="380" height="261" rx="3" stroke="#454d58" stroke-opacity=".55"/>
    <g fill="#090e13" stroke="#626d77" stroke-width="2">
      <rect x="551" y="405" width="143" height="65" rx="3"/>
      <rect x="551" y="552" width="143" height="65" rx="3"/>
    </g>
    <g fill="#71877e"><rect x="561" y="415" width="123" height="45" rx="1"/><rect x="561" y="562" width="123" height="45" rx="1"/></g>
    <g opacity=".2" stroke="#c2d4c9"><path d="M564 419h117M564 566h117"/></g>
    <rect x="378" y="442" width="125" height="160" rx="5" fill="#070d13" stroke="#3f4854" stroke-width="2"/>
    <g transform="translate(395 462)">
      <use href="#key"/><use href="#key" x="32"/><use href="#key" x="64"/>
      <use href="#key" y="30"/><use href="#key" x="32" y="30"/><use href="#key" x="64" y="30"/>
      <use href="#key" y="60"/><use href="#key" x="32" y="60"/><use href="#key" x="64" y="60"/>
      <use href="#key" y="90"/><use href="#key" x="32" y="90"/><use href="#key" x="64" y="90"/>
    </g>
    <use href="#screw" x="353" y="385"/><use href="#screw" x="713" y="385"/>
    <use href="#screw" x="353" y="626"/><use href="#screw" x="713" y="626"/>
  </g>
  <!-- Eraser-side plastic lever, with a felt pad physically below the cross. -->
  <g filter="url(#soft)">
    <path d="M304 247h21v330h14v20h-35z" fill="url(#blue)" stroke="#2453b1" stroke-width="2"/>
    <circle cx="331" cy="587" r="7" fill="#8b9aab"/>
    <rect x="278" y="176" width="73" height="116" rx="3" fill="#7e868c"/>
    <rect x="282" y="183" width="65" height="106" rx="2" fill="#545d64"/>
    <path d="M285 193h59m-59 11h59m-59 11h59m-59 11h59m-59 11h59m-59 11h59m-59 11h59m-59 11h59" stroke="#929a9d" stroke-opacity=".3" stroke-width="2"/>
    <path d="M306 159h17v48h34v17h-34v58h-17v-58h-34v-17h34z" fill="url(#blue)" stroke="#214c9e" stroke-width="2"/>
  </g>
  <!-- Marker-side lever: separate straight blue shaft and circular holder. -->
  <g filter="url(#soft)">
    <path d="M753 270h21v314h-34v-20h13z" fill="url(#blue)" stroke="#2453b1" stroke-width="2"/>
    <circle cx="747" cy="574" r="7" fill="#8b9aab"/>
    <!-- Upright cylindrical marker; 27-unit body fits the 27-unit collar opening. -->
    <ellipse cx="763.5" cy="262" rx="18" ry="9" stroke="#1c439b" stroke-width="9"/>
    <path d="M750 215 755 202h17l5 13v91c0 7-27 7-27 0z" fill="url(#marker-body)" stroke="#8196ad" stroke-width="1"/>
    <ellipse cx="763.5" cy="215" rx="13.5" ry="4" fill="#f0f4f8"/>
    <path d="m755 202 4-14h9l4 14z" fill="#354351"/>
    <path d="M760 188v-9l6-3v12z" fill="#142333"/>
    <path d="M750 296q13.5 6 27 0v6q-13.5 6-27 0z" fill="#2863b9"/>
    <path d="M745.5 262a18 9 0 0 0 36 0" stroke="#2e64c7" stroke-width="9"/>
    <path d="M748 264q15.5 10 31 0" stroke="#5188df" stroke-width="2"/>
  </g>
  </g>
  <!-- Requested conceptual flow: vision sends a target, writer uses that region. -->
  <g font-family="Consolas, monospace" font-size="17" fill="#2878bf">
    <path d="M1171 489C1080 700 850 710 706 550" fill="none" stroke="#2878bf" stroke-opacity=".65" stroke-width="2" stroke-dasharray="5 8" marker-end="url(#flow-arrow)"/>
    <text x="790" y="712">Vision → target command</text>
    <text x="112" y="746" fill="#61768a" font-size="14">ILLUSTRATIVE FLOW</text>
  </g>
  <!-- Table and observer: shape follows the supplied physical enclosure. -->
  <path d="m1015 839 485-53v214h-485z" fill="#152237"/>
  <path d="m1015 839 383-54 102 18v42l-485 55z" fill="#4a5c73"/>
  <path d="m1015 839 383-54 102 18-485 61z" fill="#718196"/>
  <g filter="url(#shadow)">
    <path d="m1161 778 180-12 31 30-187 16z" fill="#f2f3ef"/>
    <path d="m1185 812 187-16v52l-187 16z" fill="#c4cdd2"/>
    <path d="m1161 778 24 34v52l-24-33z" fill="#e0e4e3"/>
    <path d="m1213 578 72-5 18 17v141l-74 8-16-18z" fill="#b8c4cd"/>
    <path d="m1213 578 16 17v144l-16-18z" fill="#dbe2e5"/>
    <path d="m1231 500 37-3 13 14v282l-38 4-12-12z" fill="url(#white)"/>
    <path d="m1268 497 13 14v282l-13-11z" fill="#adbcc7"/>
    <!-- Eye plane faces left, toward the board, rather than toward the viewer. -->
    <path d="m1130 391 145 46 85-27-145-46z" fill="#f5f6f0"/>
    <path d="m1275 437 85-27v132l-85 27z" fill="#b8c5ce"/>
    <path d="m1130 391 145 46v132l-145-46z" fill="url(#white)" stroke="#e2e8e8" stroke-width="2"/>
    <g transform="matrix(1 .317 0 1 1130 391)">
      <ellipse cx="41" cy="65" rx="19" ry="22" fill="#182a3a"/>
      <ellipse cx="105" cy="65" rx="19" ry="22" fill="#182a3a"/>
      <path d="M26 52q13-14 28-5m36 5q13-14 28-5" stroke="#a6b5bf" stroke-width="2"/>
    </g>
  </g>
</svg>
